<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://pickabols-api.pickabolers.workers.dev wss://pickabols-api.pickabolers.workers.dev; base-uri 'none'; form-action 'none'">
<title>Pickleball Open Play</title>
<link rel="icon" type="image/png" href="logo.png">
<meta property="og:title" content="Pickleball Open Play">
<meta property="og:description" content="Live pickleball scoreboard">
<meta property="og:type" content="website">
<meta property="og:image" content="https://kridersregionalqms-art.github.io/pickabols/logo.png">
<style>
*{box-sizing:border-box}
:root{--bg:#f4f6f8;--card:#fff;--text:#1b2430;--muted:#64707d;--line:#dfe4ea;--a:#1f6feb;--b:#e8590c;--ok:#2f9e44;--bad:#d6336c;--btn:#1b2430;--btntext:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a212a;--text:#e8edf2;--muted:#93a0ae;--line:#2b3541;--a:#58a6ff;--b:#ff922b;--btn:#e8edf2;--btntext:#10151b}}
:root[data-theme="light"]{--bg:#f4f6f8;--card:#fff;--text:#1b2430;--muted:#64707d;--line:#dfe4ea;--a:#1f6feb;--b:#e8590c;--btn:#1b2430;--btntext:#fff}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a212a;--text:#e8edf2;--muted:#93a0ae;--line:#2b3541;--a:#58a6ff;--b:#ff922b;--btn:#e8edf2;--btntext:#10151b}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
#app{max-width:760px;margin:0 auto;padding:10px 10px 32px}
h1{font-size:1.25rem;margin:4px 0 2px}
h2{font-size:1rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.92rem}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:500;margin:4px 12px 4px 0}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;background:var(--btn);color:var(--btntext);cursor:pointer}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.a{background:var(--a);color:#fff}
.btn.b{background:var(--b);color:#fff}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 140px}
.muted{color:var(--muted);font-size:.9rem}
.center{text-align:center}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.team{border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.team.A{border-color:var(--a)}
.team.B{border-color:var(--b)}
.board.live .team:not(.srv){opacity:.5}
.team.A.srv{background:#1f6feb;border-color:#1f6feb;color:#fff}
.team.B.srv{background:#e8590c;border-color:#e8590c;color:#fff}
.team.srv .lbl{color:#fff}
.srvtag{font-weight:800;font-size:.85rem;margin-top:4px;min-height:1.3em}
.servebanner{border-radius:12px;padding:10px 12px;text-align:center;font-weight:800;color:#fff;margin:6px 0}
.servebanner.A{background:#1f6feb}
.servebanner.B{background:#e8590c}
.score.pop{animation:pop .6s ease}
.plus{position:absolute;top:-4px;right:8px;font-size:1.5rem;font-weight:800;color:var(--ok);animation:plusup 4s ease-out forwards}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes plusup{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.team .lbl{font-size:.68rem;font-weight:700;color:var(--muted)}
.names{font-weight:700;margin:0 0 1px;word-break:break-word;font-size:.82rem}
.score{font-size:2.2rem;font-weight:800;line-height:1;position:relative}
.call{text-align:center;font-size:1.8rem;font-weight:800;margin:14px 0 2px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:.95rem}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid var(--line)}
.tag.play{background:var(--ok);color:#fff;border-color:var(--ok)}
.tag.next{background:var(--a);color:#fff;border-color:var(--a)}
.tag.rest{color:var(--muted)}
.linkbox{word-break:break-all;font-size:.85rem;background:var(--bg);padding:8px;border-radius:8px;border:1px solid var(--line)}
.banner{background:var(--ok);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:800;margin:12px 0}
details summary{cursor:pointer;font-weight:700}
details ul{padding-left:20px;margin:8px 0}
.status{cursor:default}
.toast{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--btn);color:var(--btntext);padding:10px 14px;border-radius:10px;font-weight:700;z-index:9;max-width:90%;text-align:center}
a{color:var(--a)}
body{padding-top:52px;transition:padding-left .2s ease}
.nav-toggle{appearance:none;position:fixed;top:8px;left:8px;z-index:40;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;width:42px;height:38px;font-size:1.2rem;line-height:1;cursor:pointer}
.nav-side{position:fixed;top:0;left:0;bottom:0;width:220px;z-index:30;padding:60px 12px 12px;background:var(--card);border-right:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility .2s}
body.nav-open .nav-side{transform:none;visibility:visible}
.nav-title{font-size:.75rem;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.nav-theme{width:100%;display:flex;align-items:center;justify-content:flex-start;gap:10px}
.nav-icon{font-size:1.2rem;line-height:1}
@media (min-width:900px){body.nav-open{padding-left:220px}.nav-side{box-shadow:none}}
.court{border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0 2px}
.crow{display:grid;grid-template-columns:1fr 1fr}
.cc{min-height:90px;padding:8px 4px;text-align:center;background:#6b7684;color:#fff;border:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;gap:2px}
.cc.srv{background:#2f9e44}
.cc.rcv{background:#e03131}
.cc.empty{background:transparent;border-color:transparent}
.cname{font-weight:800;font-size:.88rem;word-break:break-word}
.crole{font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em}
.cside{font-size:.68rem;font-weight:700;opacity:.9}
.cpts{font-size:.66rem;font-weight:700;opacity:.95}
.cc.tap{cursor:pointer;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cc.tap:active{filter:brightness(1.25)}
.nav-side .btn + .btn{margin-top:8px}
.nav-theme[hidden]{display:none}
.sw-row{appearance:none;width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font:inherit;font-weight:700;cursor:pointer;text-align:left}
.sw-name{flex:1 1 auto}
.sw-state{font-weight:600;font-size:.9rem;color:var(--muted)}
.sw-track{position:relative;flex:0 0 auto;width:44px;height:26px;border-radius:999px;background:#6b7684;transition:background .2s ease}
.sw-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s ease}
.sw-row.on .sw-track{background:#38a3ee}
.sw-row.on .sw-knob{transform:translateX(18px);background:#10151b}
.sw-row.on .sw-state{color:var(--text)}
.sw-row:disabled{opacity:.45;cursor:not-allowed}
.sw-row:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.cu-opt{display:flex;gap:8px;align-items:center;margin:8px 0 0}
.info-btn{appearance:none;flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--a);font-size:1.3rem;line-height:1;cursor:pointer}
.info-btn:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.cu-info{margin:6px 0 0;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:.88rem}
.hint-info{margin:0 0 12px;text-align:left}
.hint-info::after{content:"";position:absolute;bottom:-8px;right:12px;border:8px solid transparent;border-bottom:0;border-top-color:var(--a)}
.cu-list{margin:6px 0 0;padding:0;list-style:none}
.cu-list li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.nav-foot .sw-row{margin-top:8px}
@media (prefers-reduced-motion:reduce){.sw-track,.sw-knob{transition:none}}
.top-modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:56px 12px 12px;overflow-y:auto}
.top-modal[hidden]{display:none}
.top-card{width:100%;max-width:520px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px}
.top-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top-head h2{margin:0}
.top-h{font-size:.95rem;margin:16px 0 6px}
.top-list{margin:0;padding-left:24px}
.top-row{padding:5px 0;border-bottom:1px solid var(--line)}
.top-line{display:flex;justify-content:space-between;gap:10px}
.top-name{font-weight:700;word-break:break-word}
.top-val{color:var(--muted);font-size:.88rem;white-space:nowrap}
.cband{background:#a9cbef;color:#1b2430;text-align:center;font-weight:800;padding:5px 0;border-top:1px solid #7da6d2}
.callrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin:8px 0 4px}
.callbox{border:2px solid var(--line);border-radius:10px;text-align:center;padding:5px 3px}
.callbox.srv{border-color:#2f9e44}
.callbox.rcv{border-color:#e03131}
.warmupbox{background:var(--bg);border:2px dashed var(--a);border-radius:12px;padding:14px;text-align:center;margin:6px 0}
.wlabel{font-size:.75rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.wtime{font-size:2.4rem;font-weight:800;margin-top:2px}
.cl{font-size:.62rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.cn{font-size:1.4rem;font-weight:800;line-height:1.1}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;min-width:0;word-break:break-word}
.brand.home{flex-direction:column;text-align:center;margin:6px 0 10px;gap:4px}
.logo-lg{display:block;width:min(100%,300px);height:auto}
.logo-sm{height:40px;width:auto;max-width:45%;object-fit:contain;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.saving [data-act="rally"],.saving [data-act="undo"],.saving [data-act="save"],.saving .cc.tap{pointer-events:none;position:relative}
.saving [data-act="rally"],.saving [data-act="undo"],.saving [data-act="save"]{opacity:.75}
.saving [data-act="rally"]::after,.saving [data-act="undo"]::after,.saving [data-act="save"]::after{content:"";position:absolute;top:50%;right:10px;width:16px;height:16px;margin-top:-8px;border:3px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.saving .cc.tap::after{content:"";position:absolute;top:6px;right:6px;width:14px;height:14px;border:3px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@media (prefers-reduced-motion:reduce){.saving [data-act]::after,.saving .cc.tap::after{animation-duration:2s}}
.pick-modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto}
.pick{width:100%;max-width:460px;border:2px solid var(--a);border-radius:14px;padding:14px;background:var(--card);color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.pick-title{font-weight:800;text-align:center;margin-bottom:8px;word-break:break-word}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.nav-sub{margin:6px 0 0 12px;padding-left:8px;border-left:2px solid var(--line)}
.nav-sub[hidden]{display:none}
.nav-sub .btn{font-size:.9rem}
.nav-sub .btn.on{border-color:var(--a);color:var(--a)}
.nav-caret{margin-left:auto}
.top-groups{display:flex;gap:6px;margin:10px 0 6px}
.top-groups .btn{flex:1 1 0}
.top-groups .btn.on{background:var(--a);color:#fff;border-color:var(--a)}
.top-tabs{display:flex;gap:6px;overflow-x:auto;position:relative;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chip-tab{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
.chip-tab.on{background:var(--a);color:#fff;border-color:var(--a)}
.nav-side{overflow-y:auto}
.nav-logo{display:block;width:100%;max-width:180px;height:auto;margin:0 auto 12px}
.nav-sub.long{max-height:45vh;overflow-y:auto}
.nav-side{display:flex;flex-direction:column}
.nav-side>*{flex-shrink:0}
.nav-foot{margin-top:auto;padding-top:12px}
.nav-setpanel{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}
.nav-setpanel[hidden],.nav-org[hidden],.hint[hidden]{display:none}
.set-gap{margin-top:12px}
.hint{background:var(--a);color:#fff;border-radius:10px;padding:10px 12px;font-size:.88rem;font-weight:600;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hint .btn{margin-top:8px;background:#fff;color:#1b2430}
.hint-top{position:fixed;top:56px;left:8px;width:230px;z-index:45}
.hint-top::before{content:"";position:absolute;top:-8px;left:16px;border:8px solid transparent;border-top:0;border-bottom-color:var(--a)}
.hint-foot{margin-bottom:12px}
.hint-foot::after{content:"";position:absolute;bottom:-8px;left:24px;border:8px solid transparent;border-bottom:0;border-top-color:var(--a)}
.nav-toggle.pulse::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--bad);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,51,108,.7)}100%{box-shadow:0 0 0 10px rgba(214,51,108,0)}}
@media (max-width:420px){
  #app{padding:8px 8px 28px}
  .card{padding:10px;margin:8px 0}
  .score{font-size:1.9rem}
  .names{font-size:.76rem}
  .cname{font-size:.78rem}
  .cn{font-size:1.15rem}
  .cc{min-height:78px}
  .btn{padding:9px 12px;font-size:.92rem}
  .btn.sm{padding:5px 8px;font-size:.78rem}
}
</style>
</head>
<body>
<div id="app"><p class="muted">Loading...</p></div>
<noscript>JavaScript is required for this page to work.</noscript>
<script src="index.js?v=7"></script>
</body>
</html>
